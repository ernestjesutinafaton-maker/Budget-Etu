<div class="card">
  <div class="card-header">
    <h3><a [routerLink]="['/depenses', depense().id]">{{ depense().libelle }}</a></h3>
    <app-badge-categorie [categorie]="depense().categorie" />
  </div>
  <div class="card-body">
    <p class="montant">{{ depense().montant | currency: 'EUR' }}</p>
    <p class="date">{{ depense().date | date: 'dd/MM/yyyy' }}</p>
  </div>
</div>
